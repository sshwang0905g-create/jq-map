<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>진주퀸매물지도</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon-192-v3.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<meta name="apple-mobile-web-app-title" content="진주퀸매물지도">
<meta name="theme-color" content="#0284C7">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0284C7;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#191c3a}
  img.ic{width:96px;height:96px}
  .box{background:#fff;border-radius:18px;padding:24px 20px;width:min(330px,calc(100vw - 32px));box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
  h1{font-size:19px;margin:0 0 6px} p{font-size:13.5px;color:#555;margin:0 0 14px;line-height:1.6}
  input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border:1px solid #c9cde0;border-radius:10px}
  label{display:block;font-size:13px;color:#555;margin:12px 0;text-align:left}
  button{width:100%;font-size:16px;padding:12px;border:0;border-radius:10px;background:#0284C7;color:#fff;font-weight:bold}
  #msg{min-height:20px;font-size:13px;color:#c0392b;margin-top:10px}
  .inst{text-align:left;font-size:14px;line-height:1.75;color:#222}
</style>
</head>
<body>
<img class="ic" src="icon-512-v3.png" alt="">
<div class="box" id="lock" style="display:none">
  <h1>🔒 진주퀸매물지도</h1>
  <p>진주퀸 전용입니다. 비밀번호를 입력하세요.<br>(매물지도·실거래와 같은 비밀번호)</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">
    <label><input type="checkbox" id="keep" checked> 이 기기에서 2시간 동안 로그인 유지</label>
    <button type="submit">열기</button>
  </form>
  <div id="msg"></div>
</div>
<div class="box inst" id="inst" style="display:none">
<b>📲 홈 화면에 설치하기</b><br>
안드로이드: 크롬 오른쪽 위 <b>⋮ → 홈 화면에 추가 → 설치</b><br>
아이폰: 사파리 아래 <b>공유 → 홈 화면에 추가</b><br>
설치한 아이콘을 누르면 비밀번호를 묻고 바로 열립니다.</div>
<script>
const SALT = 'jinjuqueen-map-v1', ITER = 310000, STORE = 'jq-map-key-v2', KEEP_MS = 2 * 60 * 60 * 1000;
const $ = id => document.getElementById(id), msg = t => $('msg').textContent = t;
const b64 = u => btoa(String.fromCharCode(...u)), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
}
async function target(raw) {
  const buf = new Uint8Array(await (await fetch('go.bin?t=' + Date.now(), { cache: 'no-store' })).arrayBuffer());
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  return (await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text()).trim();
}
async function go(raw, keep, exp) {
  msg('여는 중...');
  const url = await target(raw);
  if (keep) { try { localStorage.setItem(STORE, JSON.stringify({ k: b64(raw), exp })); } catch (e) {} }
  location.replace(url);
}
(async () => {
  // 홈 화면에 설치한 아이콘(?app=1)으로 열었을 때만 잠금 화면 → 이동. 브라우저로 처음 열면 설치 안내만.
  if (!/[?&]app=1/.test(location.search)) { $('inst').style.display = 'block'; return; }
  $('lock').style.display = 'block';
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
  if (saved && !(saved.exp > Date.now())) { try { localStorage.removeItem(STORE); } catch (e) {} saved = null; msg('로그인 시간(2시간)이 지났습니다. 다시 입력해 주세요.'); }
  if (saved) {
    try { await go(unb64(saved.k), false, saved.exp); return; }
    catch (e) { try { localStorage.removeItem(STORE); } catch (_) {} msg('비밀번호가 바뀌었습니다. 다시 입력해 주세요.'); }
  }
  $('pw').focus();
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    try { await go(await deriveRaw(pw), $('keep').checked, Date.now() + KEEP_MS); }
    catch (e) { msg('비밀번호가 맞지 않습니다.'); }
  });
})();
</script>
</body>
</html>
