<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>주식관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#15803D">
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#15803D;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}img{width:120px;height:120px}a{color:#fff;background:rgba(0,0,0,.35);padding:12px 22px;border-radius:12px;text-decoration:none;font-size:16px}</style>
</head>
<body>
<img src="icon-512.png" alt="">
<a id="go" href="https://docs.google.com/spreadsheets/d/1YwqTliqnLK8gZl5oBrj4IcEn8ljk4_JQKAV5MKEV_k0/edit">주식관리 열기</a>
<div id="inst" style="display:none;background:rgba(255,255,255,.95);color:#222;border-radius:14px;padding:14px 16px;max-width:320px;font-size:14.5px;line-height:1.7;text-align:left">
<b>📲 홈 화면에 설치하기</b><br>
안드로이드: 크롬 오른쪽 위 <b>⋮ → 홈 화면에 추가 → 설치</b><br>
아이폰: 사파리 아래 <b>공유 → 홈 화면에 추가</b><br>
설치한 아이콘을 누르면 바로 열립니다.</div>
<script>
  // 홈 화면에 설치한 아이콘으로 열었을 때만 바로 이동한다.
  // (브라우저로 처음 열었을 때 이동해 버리면 설치 아이콘이 다른 사이트 것으로 잡히기 때문)
  var installed = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  if (installed) {
    setTimeout(function () { location.replace(document.getElementById('go').href); }, 300);
  } else {
    document.getElementById('inst').style.display = 'block';
  }
</script>
</body>
</html>
