<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>진주퀸매물장</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-title" content="진주퀸매물장">
<meta name="theme-color" content="#6D28D9">
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#6D28D9;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}img{width:120px;height:120px}a{color:#fff;background:rgba(0,0,0,.35);padding:12px 22px;border-radius:12px;text-decoration:none;font-size:16px}</style>
</head>
<body>
<img src="icon-512-v2.png" alt="">
<a id="go" href="https://script.google.com/macros/s/AKfycbyoyPtpI0Ix6wLXqe571dEuiwLVsrGQe5Jw-q4RSuUKYITMsgkXk51IFdb-f-ujoTTG/exec">진주퀸매물장 열기</a>
<div id="inst" style="display:none;background:rgba(255,255,255,.95);color:#222;border-radius:14px;padding:14px 16px;max-width:320px;font-size:14.5px;line-height:1.7;text-align:left">
<b>📲 홈 화면에 설치하기</b><br>
안드로이드: 크롬 오른쪽 위 <b>⋮ → 홈 화면에 추가 → 설치</b><br>
아이폰: 사파리 아래 <b>공유 → 홈 화면에 추가</b><br>
설치한 아이콘을 누르면 바로 열립니다. 진주퀸 구글 계정으로 로그인되어 있어야 열립니다.</div>
<script>
  // 홈 화면에 설치한 아이콘으로 열었을 때만 바로 이동한다(?app=1).
  var installed = /[?&]app=1/.test(location.search);
  if (installed) {
    setTimeout(function () { location.replace(document.getElementById('go').href); }, 300);
  } else {
    document.getElementById('inst').style.display = 'block';
  }
</script>
</body>
</html>
